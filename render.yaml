# Public demo on Render: the web app (static, on Render's CDN) and the API in
# DEMO_MODE (fake chain, fake 1Click, mock courier: no keys, no real money).
# Render > New > Blueprint > pick this repo. See DEPLOY.md.
services:
  - type: web
    name: doorstep-near-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev
    startCommand: npm run start -w @doorstep/api
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: API_HOST
        value: 0.0.0.0
      # Public URL of the web app below (used for CORS and pay links).
      - key: WEB_URL
        value: https://doorstep-near.onrender.com
      # The same web app on Vercel (vercel.json) may call the API too.
      - key: CORS_ORIGINS
        value: https://doorstep-near.vercel.app

  - type: web
    name: doorstep-near
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL of the API above. Baked in at build time.
      - key: VITE_API_URL
        value: https://doorstep-near-api.onrender.com
