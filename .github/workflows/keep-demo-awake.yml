# Render's free plan puts the demo API to sleep after about 15 minutes without
# visits, and waking it takes up to a minute. During judging this pings it every
# 10 minutes, so visitors don't wait. It does nothing after 25 Nov 2026.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the demo API
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261125 ]; then
            echo "Judging is over; nothing to do."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://doorstep-near-api.onrender.com/health
